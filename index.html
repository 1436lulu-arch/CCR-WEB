<!DOCTYPE html>
<html lang="fr">
<head>

<title>CCR – Calculs gaz</title>

<style>
:root {
  color-scheme: light;
  --bg1:#eef2f6; --bg2:#e3e9f0; --nav:#ffffff; --card:rgba(255,255,255,.92); --card-b:rgba(0,0,0,.09);
  --text:#111827; --label:#5b6572; --tab:#6b7280; --tab-on:#0b0f14;
  --accent:#007b8f; --seafoam:#00805f; --violet:#7a3fc2; --result:#8c7a00; --warn:#b45309; --danger:#c62828;
  --tile:rgba(0,0,0,.05); --input-b:rgba(0,0,0,.3); --step:rgba(0,0,0,.07); --cellv:#8a5a1a;
  --c-param:#b45309; --c-temps:#9a6b2f; --c-vol:#2e7d32; --c-dist:#7a8a00;
  --label2: var(--seafoam); --label3: #a0611f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg1:#0b0f14; --bg2:#161d27; --nav:#0b0f14; --card:rgba(30,41,59,.6); --card-b:rgba(255,255,255,.06);
  --text:#ffffff; --label:#9aa4ae; --tab:rgba(150,150,150,.75); --tab-on:#ffffff;
  --accent:#00e5ff; --seafoam:#00ffc8; --violet:#bb86fc; --result:#f4ff06; --warn:#ffa500; --danger:#ff4444;
  --tile:rgba(0,0,0,.22); --input-b:rgba(255,255,255,.3); --step:rgba(255,255,255,.09); --cellv:#ffe4c4;
  --c-param:#ffa500; --c-temps:#ffd296; --c-vol:#4caf50; --c-dist:#cdd63a; --label3: #ca8133;
}
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg1:#0b0f14; --bg2:#161d27; --nav:#0b0f14; --card:rgba(30,41,59,.6); --card-b:rgba(255,255,255,.06);
  --text:#ffffff; --label:#9aa4ae; --tab:rgba(150,150,150,.75); --tab-on:#ffffff;
  --accent:#00e5ff; --seafoam:#00ffc8; --violet:#bb86fc; --result:#f4ff06; --warn:#ffa500; --danger:#ff4444;
  --tile:rgba(0,0,0,.22); --input-b:rgba(255,255,255,.3); --step:rgba(255,255,255,.09); --cellv:#ffe4c4;
  --c-param:#ffa500; --c-temps:#ffd296; --c-vol:#4caf50; --c-dist:#cdd63a; --label3: #ca8133;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg2);
  background-image: linear-gradient(var(--bg1), var(--bg2));
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; background: var(--nav); height: 52px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25); border-bottom: 1px solid var(--card-b);
}
.nav-in { position: relative; display: flex; width: 100%; max-width: 560px; margin: 0 auto; }
.nav button {
  flex: 1; height: 52px; border: 0; background: none; color: var(--tab); cursor: pointer;
  /* MODIFICATION ICI : Minimum 10px sur téléphone, s'adapte avec l'écran, Maximum 15px sur PC */
  font: 500 clamp(10px, 1.5vw + 6px, 15px)/1 inherit; 
  font-family: inherit; letter-spacing: .8px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
}

.nav button[aria-selected="true"] { color: var(--tab-on); font-weight: 900; }
.ind { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(100% / 8); padding: 0 12px; transition: transform .25s ease; pointer-events: none; }
.ind::after { content: ""; display: block; height: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
.page { display: none; flex-direction: column; gap: 20px; }
.page.on { display: flex; }
.ptitle { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 700; }
.badge { width: 32px; height: 32px; border: 2px solid #888; border-radius: 6px; background: #000; color: #f00; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.card { background: var(--card); border: 1px solid var(--card-b); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ctitle { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--label); }
.ctitle i { width: 4px; height: 16px; border-radius: 2px; background: var(--ac, #888); flex: none; }
.dyn { display: flex; flex-direction: column; gap: 12px; }
.row2 { display: flex; gap: 8px; }
.row2 > .nf { flex: 1; }
.rowc { display: flex; justify-content: center; }
.nf { display: flex; flex-direction: column; align-items: center; }
.nf > label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; white-space: nowrap; }
.nfrow { display: flex; align-items: center; gap: 2px; }
.nfrow input {
  width: 72px; height: 44px; padding: 0 8px; text-align: center;
  font: 700 20px/1 inherit; font-family: inherit; color: var(--fc, var(--text));
  background: transparent; border: 1.5px solid var(--input-b); border-radius: 10px; outline: none;
}
.nfrow input:focus { border-color: var(--fc, var(--text)); }
.nfrow input.err { border-color: var(--danger); }
.step { width: 32px; height: 44px; border: 0; border-radius: 10px; background: var(--step); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.step:active { opacity: .6; }
.btn { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: 600 15px/1 inherit; font-family: inherit; cursor: pointer; }
.btn:disabled { opacity: .35; cursor: default; }
.btn:not(:disabled):active { background: var(--step); }
.alert { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.alert svg { flex: none; }
.rbox { display: flex; flex-direction: column; align-items: center; padding: 14px 12px; border-radius: 16px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, transparent), color-mix(in srgb, var(--c) 10%, transparent));
  border: 2px solid color-mix(in srgb, var(--c) 90%, transparent);
  box-shadow: 0 0 16px color-mix(in srgb, var(--c) 22%, transparent); }
.rbox .rbl { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; color: var(--c); text-align: center; }
.rbox .rbv { font-size: clamp(24px, 8vw, 30px); font-weight: 900; letter-spacing: 1px; color: var(--c); white-space: nowrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rc { background: var(--tile); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.rl { font-size: 14px; font-weight: 600; letter-spacing: .5px; opacity: .88; }
.rv { display: flex; align-items: center; gap: 4px; font-size: 18px; font-weight: 700; white-space: nowrap; }
.ru { font-size: 12px; font-weight: 400; color: var(--label); margin-left: -1px; }
.rr { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.rrl { font-size: 16px; font-weight: 600; opacity: .88; }
.rrv { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; }
.tiles { display: flex; gap: 12px; }
.tile { flex: 1; background: var(--tile); border-radius: 12px; padding: 8px; text-align: center; }
.tile .t1 { font-size: 9px; color: var(--label); }
.tile .t2 { font-size: 18px; font-weight: 700; color: var(--cellv); }
.tile .t3 { font-size: 9px; font-weight: 700; color: var(--accent); opacity: .85; }
.hint { font-size: 14px; color: var(--label); }
.hint.src { color: var(--label3); }                          /* lignes « Source » */
.hint.ok { color: var(--label2); white-space: pre-line; }   /* lignes « Choix validé » */
.hint.pre { white-space: pre-line; }
.hint.lh { line-height: 20px; }
.hint.sm { font-size: 13px; line-height: 16px; }
/* Plan de gonflage */
.gblock { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--card-b); }
.gblock:first-of-type { border-top: 0; padding-top: 0; }
.gb-h { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; color: var(--violet); }
.sw { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--label); font: 700 12px/1 inherit; font-family: inherit; cursor: pointer; padding: 4px; -webkit-tap-highlight-color: transparent; }
.sw[aria-checked="true"] { color: var(--seafoam); }
.swk { position: relative; width: 40px; height: 22px; border-radius: 11px; background: var(--step); border: 1px solid var(--input-b); transition: background .15s; }
.swk::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--label); transition: transform .15s, background .15s; }
.sw[aria-checked="true"] .swk { background: color-mix(in srgb, var(--seafoam) 35%, transparent); }
.sw[aria-checked="true"] .swk::after { transform: translateX(18px); background: var(--seafoam); }
.prow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--card-b); }
.prow:first-child { border-top: 0; }
.pn { width: 22px; font-size: 16px; font-weight: 700; color: var(--label); }
.pl { flex: 1; font-size: 15px; font-weight: 600; }
.pa { text-align: right; display: flex; flex-direction: column; }
.pa b { font-size: 18px; font-weight: 900; color: var(--accent); }
.pa span { font-size: 14px; font-weight: 700; color: var(--result); }
.prow.off .pl, .prow.off .pa b, .prow.off .pa span { color: var(--label); font-weight: 500; }
.hl { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--card-b); }
.hl:first-child { border-top: 0; }
.hl-t { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; }
.hl-t i { font-style: normal; font-size: 12px; font-weight: 700; color: var(--seafoam); }
.hl.bad .hl-t { color: var(--label); }
.hl.bad .hl-t i { color: var(--warn); }
</style>
</head>

<script>
(function () {
'use strict';

/* ───────────── Stockage local (par appareil) ───────────── */
var KEY = 'ccr1:';
function lsGet(k) { try { return localStorage.getItem(KEY + k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(KEY + k, v); } catch (e) {} }
var NAMES = ['prof','dilO2','dilHe','boO2','boHe','trO2','trHe','swt','decoO2','injO2','injHe','tgO2','tgHe','c1','c2','heli',
             'gBo2','gBhe','gBbar','gTo2','gThe','gTbar','gTxO2','gTxHe','gNxO2','gNxHe','gHpO2','gHpHe','gAirO2','gAirHe','gHeli','gTxOn','gNxOn','gHpOn','gO2On',
             'sProf','sConso','sTpsp','sCs','sTpsr','sVol','sDist','sPb','sVolR','sCsR','sPbR','boPea','boDens','dPpo2','dDens','dPea','decoSrc','swO2','swHe','trSrc','dilSrc','decoSel','boSrc'];
var S = {};
NAMES.forEach(function (n) { S[n] = lsGet(n); });
if (S.boPea === '') S.boPea = '30';     // réglages du bailout proposé (valeurs par défaut)
if (S.boDens === '') S.boDens = '6.3';
if (S.dPpo2 === '') S.dPpo2 = '1';      // réglages du diluant proposé (valeurs par défaut)
if (S.dDens === '') S.dDens = '6.1';
if (S.dPea === '') S.dPea = '30';
var GF_DEFAULTS = { gTxO2: '10', gTxHe: '70', gNxO2: '32', gNxHe: '0', gHpO2: '0', gHpHe: '100', gAirO2: '20.95', gAirHe: '0', gHeli: '10', gTxOn: '1', gNxOn: '1', gHpOn: '1', gO2On: '1' };
Object.keys(GF_DEFAULTS).forEach(function (k) { if (S[k] === '') S[k] = GF_DEFAULTS[k]; });   // plan de gonflage : gaz dispo par défaut

//<calc>
/* ───────────── Outils de calcul ───────────── */
function dec(s) {
  if (s == null) return null;
  var t = String(s).replace(',', '.').trim();
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  var n = Number(t);
  return isFinite(n) ? n : null;
}
function f(x, d) { return x.toFixed(d).replace('.', ','); }
function fo(x, d) { return (x == null || isNaN(x)) ? '--' : f(x, d); }
function clampv(x, lo, hi, def) { return x == null ? def : Math.min(Math.max(x, lo), hi); }
function clean(x) { return x % 1 === 0 ? String(Math.trunc(x)) : f(x, 1); }
function nz(x) { return x == null ? 0 : x; }
var RHO = { o2: 1.359, n2: 1.189, he: 0.170 };   // g/L à 15 °C (CE/ISO)
var SETPOINT = 1.3;
var AUTO_MIN_DEPTH = 31.6, BAILOUT_MIN_DEPTH = 37.6;
var HE_DEFAULT_PCT = 98;
var AUTO_MAX_DENS = 6.10;   // densité maxi du diluant proposé (g/L)
/* Contraintes du bailout proposé */
var BO_PPO2_MAX = 1.6, BO_PPO2_MIN = 1.3;   // PPO2 entre 1.3 et 1.6
var BO_N2_MAX_PTS = 4;                      // N2 du BO ≤ N2 du diluant + 4 points
var BO_CDI_PCT_MAX = 10;                    // écart relatif de N2 ≤ 10 %
var BO_CDI_MAX = 0.5;                       // delta PPN2 ≤ 0.5 bar (diluant et boucle)
var BO_PEA_MAX = 34;                        // PEA ≤ 34 m
var BO_DENS_MAX = 6.9;                      // densité ≤ 6.9 g/L

var LIM = {
  ppo2: function (v) { return (v > 1.15 || v < 0.48) ? 'danger' : (v > 1.1 || v < 0.5) ? 'warn' : 'ok'; },
  pea: function (v) { return v > 35 ? 'danger' : v > 31 ? 'warn' : 'ok'; },
  ppo2Bailout: function (v) { return (v > 1.6 || v < 0.48) ? 'danger' : v < 0.5 ? 'warn' : 'ok'; },
  cdiPpn2: function (v) { return v > 0.5 ? 'danger' : 'ok'; },
  cdiPercent: function (v) { return v > 20 ? 'danger' : v > 10 ? 'warn' : 'ok'; },
  densite: function (v) { return v > 6.8 ? 'danger' : v > 6.3 ? 'warn' : 'ok'; }
};
function st(x, fn) { return x == null ? 'ok' : fn(x); }

function build(o2, he, n2, pabs) {
  var ppn2 = n2 * pabs / 100;
  return { o2: o2, he: he, n2: n2, ppo2: o2 * pabs / 100, ppn2: ppn2,
           pea: ((ppn2 / 0.79) - 1) * 10,
           densite: (o2 * RHO.o2 + he * RHO.he + n2 * RHO.n2) / 100 * pabs };
}
function ppn2ForPea(pea) { return 0.79 * (pea / 10 + 1); }       // 30 m -> 3.16 bar
function autoMinDepth(ppo2, pea) { return (ppo2 + ppn2ForPea(pea) - 1) * 10; }
function autoDil(pabs, ppo2, pea, densMax) {
  var o2 = 100 * (ppo2 / pabs), n2 = 100 * (ppn2ForPea(pea) / pabs);
  // N₂ maximal pour ne pas dépasser la densité limite (le N₂ est remplacé par de l'hélium)
  var n2Max = (densMax / pabs * 100 - 100 * RHO.he - o2 * (RHO.o2 - RHO.he)) / (RHO.n2 - RHO.he);
  n2 = Math.min(n2, Math.max(n2Max, 0));
  return build(o2, 100 - o2 - n2, n2, pabs);
}
function mix(o2, he, pabs) {
  if (!(o2 >= 0 && o2 <= 100) || !(he >= 0 && he <= 100) || o2 + he > 100) return null;
  return build(o2, he, 100 - o2 - he, pabs);
}
/* Bailout proposé : le plus de N₂ possible dans les limites, PPO₂ la plus haute possible entre 1.3 et 1.6 */
function bailoutProposed(pabs, ppn2Dil, ppn2Boucle, peaMax, densMax) {
  if (pabs <= 1.0) return null;
  var o2Pref = BO_PPO2_MAX / pabs * 100, o2Min = BO_PPO2_MIN / pabs * 100;
  if (o2Min > 100) return null;
  var n2Cap = 0.79 * (1 + peaMax / 10) / pabs * 100;
  if (ppn2Dil > 0) {
    var n2Dil = ppn2Dil / pabs * 100;
    n2Cap = Math.min(n2Cap, n2Dil + BO_N2_MAX_PTS, n2Dil * (1 + BO_CDI_PCT_MAX / 100), (ppn2Dil + BO_CDI_MAX) / pabs * 100);
    if (ppn2Boucle > 0) n2Cap = Math.min(n2Cap, (ppn2Boucle + BO_CDI_MAX) / pabs * 100);
  } else {
    n2Cap = Math.min(n2Cap, 3.16 / pabs * 100);
  }
  var o2 = Math.min(Math.max(Math.min(o2Pref, 100 - n2Cap), o2Min), 100);
  // densité : si elle dépasse la limite, on remplace du N₂ par de l'hélium (l'O₂ ne bouge pas)
  var n2Dens = (densMax / pabs * 100 - 100 * RHO.he - o2 * (RHO.o2 - RHO.he)) / (RHO.n2 - RHO.he);
  var n2 = Math.max(Math.min(n2Cap, 100 - o2, n2Dens), 0);
  return build(o2, 100 - o2 - n2, n2, pabs);
}
function loopMix(dil, pabs) {
  var o2 = SETPOINT / pabs * 100;
  if (o2 > 100) return null;
  var n2 = dil.n2 > 0 ? (100 - o2) / (1 + dil.he / dil.n2) : 0;
  return build(o2, 100 - o2 - n2, n2, pabs);
}

/* Travel */
/* Travel proposé : règles par zone de profondeur de plongée */
var TR = { aMax: 40, bMax: 75, aO2: 0.32, bO2Min: 50, ppo2Max: 1.6, ppo2Min: 1.4, cdiMax: 0.5, dn2Max: 0.25, depthMax: 45, boSwPpo2: 0.5, n2MaxPts: 0.04 };   // zone 76–120 m : switch le plus haut (PPO₂ BO 0.5), N₂ ≤ BO + 4 points
function proposeTravel(profondeur, o2bopPct, n2bopPct) {
  if (!(profondeur > 0)) return null;
  var o2bop = o2bopPct / 100, n2bop = n2bopPct / 100, hasBo = o2bop > 0;
  var pCap = TR.depthMax / 10 + 1, o2, he, pabs, zone;
  if (profondeur <= TR.aMax) {                    // 1–40 m : NX 32, switch à PPO2 1.6
    o2 = TR.aO2; he = 0; pabs = TR.ppo2Max / o2;
    zone = 'Zone 1–40 m : NX 32 systématique';
  } else if (profondeur <= TR.bMax) {             // 41–75 m : plus petit NX ≥ 50 % dans les limites
    zone = 'Zone 41–75 m : NX ≥ 50 %, PPO₂ 1.4–1.6, CDI ≤ 0.5 bar, écart N₂ ≤ 25 %';
    var found = false;
    for (var pct = TR.bO2Min; pct <= 100 && !found; pct++) {
      var o = pct / 100, n = 1 - o, p = Math.min(TR.ppo2Max / o, pCap);
      if (hasBo) {
        if (n2bop > 0 && n > (1 + TR.dn2Max) * n2bop + 1e-9) continue;
        if (n > n2bop) p = Math.min(p, TR.cdiMax / (n - n2bop));
      }
      if (p >= TR.ppo2Min / o - 1e-9) { o2 = o; he = 0; pabs = p; found = true; }
    }
    if (!found) return null;
  } else {                                        // 76–120 m : le plus de N₂ possible, hélium en complément
    zone = 'Zone 76–120 m : PPO₂ 1.4–1.6, PPO₂ BO ≥ 0.5, N₂ ≤ BO + 4 pts, CDI ≤ 0.5 bar, écart N₂ ≤ 25 %, switch ≤ 45 m';
    if (!hasBo) return null;
    var p2 = Math.min(TR.boSwPpo2 / o2bop, pCap);
    if (p2 <= 1.0) return null;
    var o2Pref = TR.ppo2Max / p2, o2Min = TR.ppo2Min / p2;
    if (o2Min > 1.0) return null;
    var n2Cap = n2bop > 0 ? Math.min((1 + TR.dn2Max) * n2bop, n2bop + TR.n2MaxPts, n2bop + TR.cdiMax / p2) : Math.min(TR.n2MaxPts, TR.cdiMax / p2);
    o2 = Math.min(Math.max(Math.min(o2Pref, 1 - n2Cap), o2Min), 1.0);
    var n2b = Math.max(Math.min(n2Cap, 1 - o2), 0);
    he = 1 - o2 - n2b; pabs = p2;
  }
  var n2 = 1 - o2 - he;
  return { isNx: he < 0.005, o2: o2, he: he, n2: n2, profondeur: (pabs - 1) * 10,
           densite: (o2 * RHO.o2 + he * RHO.he + n2 * RHO.n2) * pabs,
           cdi: hasBo ? (n2 - n2bop) * pabs : null, ppo2Bo: hasBo ? o2bop * pabs : null,
           cdiPercent: n2bopPct > 0 ? ((n2 * 100 / n2bopPct) - 1) * 100 : null, zone: zone };
}
/* Travel proposé pour un switch imposé (mêmes règles que proposeTravel) -> {o2, he} en fractions, ou null */
var SW_DEPTH_MAX = 120;   // Choix SW du Travel : seule limite = celle de l'appli

function switchAlerts(o2Text, o2In, heIn, at, cdiPct) {
  var s = '';
  if (o2Text.trim() !== '' && o2In < 5) s += alertB('O₂ inférieur à 5 %');
  if (o2In + heIn > 100) s += alertB('O₂ + He dépasse 100 % (' + f(o2In + heIn, 2) + ' %)');
  if (at) {
    if (at.pea > 35) s += alertB('PEA supérieure à 35 m');
    var sd = LIM.densite(at.densite);
    if (sd === 'danger') s += alertB('Densité supérieure à 6.8 g/L');
    else if (sd === 'warn') s += alertB('Densité supérieure à 6.3 g/L', 'warn');
    if (nz(at.cdi) > 0.5) s += alertB('Alerte contre-diffusion');
    if ((at.ppo2Bo == null ? 1.0 : at.ppo2Bo) < 0.5) s += alertB('PPO₂ du BO inférieure à 0.5 au switch');
    if (at.ppo2Travel > 1.7) s += alertB('PPO₂ du Travel supérieure à 1.7 au switch');
    else if (at.ppo2Travel > 1.61) s += alertB('PPO₂ du Travel supérieure à 1.6 au switch', 'warn');
  }
  if (cdiPct != null) {
    if (cdiPct > 19) s += alertB('Diff % N₂ : choix du Travel à revoir');
    else if (cdiPct >= 14 && cdiPct <= 19) s += alertB('Attention : écart de % N₂', 'warn');
  }
  return s;
}
function switchResults(at, n2, cdiPct, cdiLabel, swMode) {
  var s = '';
  s += pair('PEA', at ? fo(at.pea, 2) : '--', ' m', at ? LIM.pea(at.pea) : 'ok',
            'PPO₂ BO SW', at && at.ppo2Bo != null ? f(at.ppo2Bo, 2) : '--', ' bar', at && at.ppo2Bo != null ? boSwitchStatus(at.ppo2Bo) : 'ok');
  s += pair('N₂', at ? f(n2, 1) : '--', ' %', 'ok', 'PPN₂', at ? f(at.ppn2, 2) : '--', ' bar', 'ok');
  var cdiV = at && at.cdi != null ? f(at.cdi, 2) : '--', cdiS = at && at.cdi != null ? LIM.cdiPpn2(at.cdi) : 'ok';
  var pctV = cdiPct != null ? f(cdiPct, 2) : '--', pctS = cdiPct != null ? LIM.cdiPercent(cdiPct) : 'ok';

  var airZone = profondeur > 0 && profondeur <= 40;     // 1–40 m : air, sans calcul
  var autoM = airZone ? build(21, 0, 79, pabs) : autoDil(pabs, ppo2Dil, peaEq, densDil), autoUsable = profondeur > 0 && autoM.he >= 0;
  var o2V = dec(S.dilO2), heV = dec(S.dilHe);
  var dil = (o2V != null && heV != null) ? mix(o2V, heV, pabs) : null;
  var boucle = dil ? loopMix(dil, pabs) : null;
  M.autoM = autoM; M.autoUsable = autoUsable;
  var ppn2Dil = dil ? dil.ppn2 : 0, ppn2Boucle = boucle ? boucle.ppn2 : 0;

      (airZone ? hint('Profondeur ≤ 40 m : air, sans calcul') : autoM.n2 < 100 * ppn2ForPea(peaEq) / pabs - 0.05 ? hint('N₂ réduit pour limiter la densité à ' + f(densDil, 2) + ' g/L (PEA inférieure à ' + f(peaEq, 0) + ' m)') : '');
  } else {

  var al = '';

  if (o2V != null && o2V > 50) al += alertB('O₂ supérieur à 50 %');
  if (o2V != null && heV != null && o2V + heV > 100) al += alertB('O₂ + He dépasse 100 % (' + f(o2V + heV, 2) + ' %)');

    mixHead(dil ? clean(dil.o2) : '--', dil ? clean(dil.he) : '--', 'var(--result)', 'DILUANT CHOISI') +
    pair('PEA', dil ? f(dil.pea, 2) : '--', ' m', dil ? LIM.pea(dil.pea) : 'ok', 'PPO₂', dil ? f(dil.ppo2, 2) : '--', ' bar', dil ? LIM.ppo2(dil.ppo2) : 'ok') +

var GF_HE_TXT = { above: 'O₂ supérieur à l\'air', rich: 'Impossible : trop d\'O₂ dans l\'air', henoneg: 'O₂ trop bas (He pur &lt; 0)' };
function gfNum(k) { return nz(dec(S[k])); }
function gfMix(ko, kh) { return gas(gfNum(ko) / 100, gfNum(kh) / 100); }
function gfBar(v) { return Math.abs(v) < 0.05 ? '0' : f(v, 1); }
function gfName(o2Pct, hePct) { return prefix(hePct) + ' ' + f(o2Pct, 1) + ' / ' + f(hePct, 1); }
function gfSigned(v) { return (v < 0 ? '−' : '+') + f(Math.abs(v), 1); }
function gfN2Row(g) { return rrow('N₂', f(g.n2 * 100, 1), ' %', g.n2 < -1e-9 ? 'danger' : 'ok'); }
function gfPlanRow(n, label, add, total, active) {
  return '<div class="prow' + (active ? '' : ' off') + '"><span class="pn">' + n + '</span><span class="pl">' + label +
    '</span><span class="pa"><b>' + (n === 0 ? 'départ' : '+ ' + gfBar(add) + ' bar') + '</b><span>→ ' + gfBar(total) + ' bar</span></span></div>';
}
function gfUpdate() {
  var bloc = gfMix('gBo2', 'gBhe'), cible = gfMix('gTo2', 'gThe'), tx = gfMix('gTxO2', 'gTxHe'), nx = gfMix('gNxO2', 'gNxHe'),
      hp = gfMix('gHpO2', 'gHpHe'), air = gfMix('gAirO2', 'gAirHe');
  var avT = S.gTxOn !== '0', avN = S.gNxOn !== '0', avH = S.gHpOn !== '0', avO = S.gO2On !== '0', blocBar = gfNum('gBbar'), cibleBar = gfNum('gTbar');
  D.gfBloc.innerHTML = gfN2Row(bloc);
  D.gfCible.innerHTML = gfN2Row(cible) + (cible.o2 > 0 && gValid(cible) ? resultBox(gfName(cible.o2 * 100, cible.he * 100), 'var(--accent)', 'MÉLANGE VISÉ') : '');
  D.gfTx.innerHTML = gfN2Row(tx); D.gfNx.innerHTML = gfN2Row(nx); D.gfHp.innerHTML = gfN2Row(hp); D.gfAir.innerHTML = gfN2Row(air);
  GF.gfTx.style.display = avT ? '' : 'none'; GF.gfNx.style.display = avN ? '' : 'none'; GF.gfHp.style.display = avH ? '' : 'none';

  var probs = [];
  if (!gValid(bloc)) probs.push('Bloc actuel : O₂ + He dépasse 100 %');
  if (!gValid(cible)) probs.push('Cible : O₂ + He dépasse 100 %');
  if (avT && !gValid(tx)) probs.push('Trimix dispo : O₂ + He dépasse 100 %');
  if (avN && !gValid(nx)) probs.push('Nitrox / Trimix 2 dispo : O₂ + He dépasse 100 %');
  if (avH && !gValid(hp)) probs.push('He pur : O₂ + He dépasse 100 %');
  if (!gValid(air)) probs.push('Air : O₂ + He dépasse 100 %');
  var ready = !probs.length && blocBar > 0 && cibleBar > 0 && cible.o2 > 0;
  var alerts = probs.map(function (t) { return alertB(t); }).join('');
  D.gfAlerts.innerHTML = alerts + (!ready && !probs.length ? hint('Renseigne les pressions et mélanges du bloc et de la cible pour calculer.') : '');
  D.heMsg.innerHTML = alerts + (!ready && !probs.length ? hint('Renseigne le bloc, la cible et les gaz dans la page Gonf.') : '');
  [GF.cPurge, GF.cPlan, GF.cUnique, GF.cHeData, GF.cHeChoice, GF.cHeTable].forEach(function (c) { c.sec.style.display = ready ? '' : 'none'; });
  if (!ready) return;

  var r = gfCompute({ bloc: bloc, blocBar: blocBar, target: cible, targetBar: cibleBar, t1: tx, t2: nx, he: hp, air: air, avT1: avT, avT2: avN, avHe: avH, avO2: avO });
  var approx = r.status === 'approx';

  D.gfPurge.innerHTML = rrow('Pression max du bloc', gfBar(r.purge.max), ' bar') +
    rrow('Purge recommandée', gfBar(r.purge.purge), ' bar', r.purge.purge > 0 ? 'warn' : 'ok') +
    rrow('Bloc après purge', gfBar(r.purge.after), ' bar');

  var used = [];
  if (r.trimix >= 0.05) used.push('Trimix dispo');
  if (r.nitrox >= 0.05) used.push('Nitrox / Trimix 2');
  if (r.air >= 0.05) used.push('air');
  var html = (approx ? alertB('Cible non atteignable avec ces gaz : voici le meilleur mélange possible', 'warn') : '') +
    hint(used.length ? 'Gaz utilisés : ' + used.join(' + ') : 'Gaz purs seulement');
  var rows = '', n = 0;
  r.steps.forEach(function (s) {
    if ((s.kind === 'trimix' && !avT) || (s.kind === 'nitrox' && !avN) || (s.kind === 'he' && !avH) || (s.kind === 'o2' && !avO)) return;
    var label = { start: 'Bloc après purge', o2: 'Oxygène pur', he: 'Hélium pur', trimix: 'Trimix dispo  ' + gfName(tx.o2 * 100, tx.he * 100),
                  nitrox: 'Nitrox / Trimix 2  ' + gfName(nx.o2 * 100, nx.he * 100), air: 'Air' }[s.kind];
    rows += gfPlanRow(n, label, s.add, s.total, s.kind === 'start' || Math.abs(s.add) >= 0.05); n++;
  });
  html += '<div>' + rows + '</div>';
  if (r.fin) {
    html += resultBox(gfName(r.fin.o2 * 100, r.fin.he * 100), 'var(--result)', (approx ? 'MÉLANGE OBTENU (APPROCHÉ)' : 'MÉLANGE OBTENU') + ' · ' + gfBar(r.total) + ' BAR') +
      rrow('N₂ obtenu', f(r.fin.n2 * 100, 1), ' %');
    if (approx) html += rrow('Écart O₂ / cible', gfSigned(r.dev.o2 * 100), ' pt', 'warn') + rrow('Écart He / cible', gfSigned(r.dev.he * 100), ' pt', 'warn');
  }
  D.gfPlan.innerHTML = html;

  var u = r.unique;
  D.gfUnique.innerHTML = hint('Mélange à préparer pour atteindre la cible en un seul remplissage sur le bloc purgé.') +
    (u.ok ? resultBox(gfName(u.o2 * 100, u.he * 100), 'var(--violet)', 'À AJOUTER · ' + gfBar(u.add) + ' BAR') + rrow('N₂', f(u.n2 * 100, 1), ' %')
          : alertB('Cible hors de portée en un seul mélange'));

  /* Héliair */
  var hl = r.heliair;
  D.heData.innerHTML = rrow('Bloc après purge', gfBar(hl.start), ' bar') +
    rrow('Départ', gfName(bloc.o2 * 100, bloc.he * 100)) +
    rrow('Cible', gfName(cible.o2 * 100, cible.he * 100) + ' · ' + gfBar(cibleBar) + ' bar') +
    rrow('Purge pour l\'héliair', gfBar(hl.purge), ' bar', hl.purge > 0 ? 'warn' : 'ok') +
    rrow('Hélium à apporter', gfBar(hl.needHe), ' bar') +
    rrow('Air dans l\'héliair', gfBar(hl.air), ' bar') +
    (avO ? rrow('O₂ pur à ajouter d\'abord', gfBar(hl.o2Pure), ' bar', hl.ok ? 'ok' : 'danger') : rrow('O₂ pur (désactivé)', gfBar(hl.o2Pure), ' bar', hl.ok ? 'ok' : 'danger')) +
    (hl.ok ? '' : alertB(avO ? 'L\'air apporte déjà trop d\'O₂ : purge davantage ou utilise un autre gaz' : 'Sans O₂ pur, l\'air ne peut pas équilibrer l\'oxygène de ce plan'));
  GF.cHeChoice.sec.style.display = hl.ok ? '' : 'none';
  GF.cHeTable.sec.style.display = (hl.ok && avH) ? '' : 'none';
  if (!hl.ok) return;
  var o2Sel = avH ? gfNum('gHeli') : (hl.air + hl.needHe > 0 ? hl.airO2 * hl.air / (hl.air + hl.needHe) * 100 : hl.airO2 * 100);
  GF.heField.style.display = avH ? '' : 'none';                   // sans He pur : tout l'hélium passe par l'héliair
  var row = gfHeliairRow(hl, o2Sel);
  if (row.status !== 'ok') {
    D.heChoice.innerHTML = alertB(GF_HE_TXT[row.status], 'warn');
  } else {
    var hrows = [['Bloc après purge', 0, hl.start, true]];
    if (avO) hrows.push(['Oxygène pur', hl.o2Pure, hl.start + hl.o2Pure, hl.o2Pure >= 0.05]);
    if (avH) hrows.push(['Hélium pur', row.hePure, row.before, row.hePure >= 0.05]);
    hrows.push(['Héliair  ' + gfName(row.o2, row.he), row.bars, row.before + row.bars, true]);
    D.heChoice.innerHTML = (avH ? '' : hint('Hélium pur désactivé : tout l\'hélium passe par l\'héliair.')) +
      resultBox(gfName(row.o2, row.he), 'var(--violet)', 'HÉLIAIR À RÉGLER') + '<div>' +
      hrows.map(function (q, idx) { return gfPlanRow(idx, q[0], q[1], q[2], q[3]); }).join('') + '</div>';
  }
  if (avH) D.heTable.innerHTML = hint('O₂ % rond à régler sur le compresseur. Plus l\'héliair est riche en O₂, plus tu mets d\'hélium pur avant.') +
    '<div>' + GF_PRESETS.map(function (o) {
      var q = gfHeliairRow(hl, o), ok = q.status === 'ok';
      return '<div class="hl' + (ok ? '' : ' bad') + '"><div class="hl-t"><span>' + gfName(q.o2, q.he) + '</span><i>' + (ok ? 'OK' : GF_HE_TXT[q.status]) + '</i></div>' +
        (ok ? '<div class="hint sm">He pur ' + gfBar(q.hePure) + ' → ' + gfBar(q.before) + ' bar, puis héliair + ' + gfBar(q.bars) + ' bar</div>' : '') + '</div>';
    }).join('') + '</div>';
}

/* ───────────── Onglets ───────────── */
var TABS = ['Dil', 'BO', 'Trav', 'Déco', 'Mix-G', 'Sout', 'Gonf', 'Héli'];
var tabsEl = document.getElementById('tabs'), ind = document.getElementById('ind'), tabBtns = [];
TABS.forEach(function (t, i) {
  var b = h('button'); b.type = 'button'; b.textContent = t; b.setAttribute('role', 'tab');
  b.addEventListener('click', function () { showTab(i); });
  tabsEl.insertBefore(b, ind); tabBtns.push(b);
});
function showTab(i) {
  pageEls.forEach(function (p, k) { p.classList.toggle('on', k === i); });
  tabBtns.forEach(function (b, k) { b.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
  ind.style.transform = 'translateX(' + (i * 100) + '%)';
  lsSet('tab', String(i));
  window.scrollTo(0, 0);
}
var t0 = parseInt(lsGet('tab'), 10);
if (lsGet('tabv') === '8' && !isNaN(t0)) t0 = [0, 1, 2, 3, 4, 6, 7, 5][t0];   // version précédente : Gonf 5, Héli 6, Sout 7 → Sout 5, Gonf 6, Héli 7
if (lsGet('tabv') !== '9') lsSet('tabv', '9');
showTab(isNaN(t0) || t0 < 0 || t0 >= TABS.length ? 0 : t0);
update();

/* ───────────── Service worker (usage hors connexion) ───────────── */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}

})();
</script>
</body>
</html>
