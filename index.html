<style>
:root {
  color-scheme: light;
  --bg1:#eef2f6; --bg2:#e3e9f0; --nav:#ffffff; --card:rgba(255,255,255,.92); --card-b:rgba(0,0,0,.09);
  --text:#111827; --label:#5b6572; --tab:#6b7280; --tab-on:#0b0f14;
  --accent:#007b8f; --seafoam:#00805f; --violet:#7a3fc2; --result:#8c7a00; --warn:#b45309; --danger:#c62828;
  --tile:rgba(0,0,0,.05); --input-b:rgba(0,0,0,.3); --step:rgba(0,0,0,.07); --cellv:#8a5a1a;
  --c-param:#b45309; --c-temps:#9a6b2f; --c-vol:#2e7d32; --c-dist:#7a8a00;
  --label2: var(--seafoam); --label3: #a0611f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg1:#0b0f14; --bg2:#161d27; --nav:#0b0f14; --card:rgba(30,41,59,.6); --card-b:rgba(255,255,255,.06);
  --text:#ffffff; --label:#9aa4ae; --tab:rgba(150,150,150,.75); --tab-on:#ffffff;
  --accent:#00e5ff; --seafoam:#00ffc8; --violet:#bb86fc; --result:#f4ff06; --warn:#ffa500; --danger:#ff4444;
  --tile:rgba(0,0,0,.22); --input-b:rgba(255,255,255,.3); --step:rgba(255,255,255,.09); --cellv:#ffe4c4;
  --c-param:#ffa500; --c-temps:#ffd296; --c-vol:#4caf50; --c-dist:#cdd63a; --label3: #ca8133;
}
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg1:#0b0f14; --bg2:#161d27; --nav:#0b0f14; --card:rgba(30,41,59,.6); --card-b:rgba(255,255,255,.06);
  --text:#ffffff; --label:#9aa4ae; --tab:rgba(150,150,150,.75); --tab-on:#ffffff;
  --accent:#00e5ff; --seafoam:#00ffc8; --violet:#bb86fc; --result:#f4ff06; --warn:#ffa500; --danger:#ff4444;
  --tile:rgba(0,0,0,.22); --input-b:rgba(255,255,255,.3); --step:rgba(255,255,255,.09); --cellv:#ffe4c4;
  --c-param:#ffa500; --c-temps:#ffd296; --c-vol:#4caf50; --c-dist:#cdd63a; --label3: #ca8133;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100vh;
  background-color: var(--bg2);
  background-image: linear-gradient(var(--bg1), var(--bg2));
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; background: var(--nav); height: 52px;
  box-shadow: 0 2px 12px rgba(0,0,0,.25); border-bottom: 1px solid var(--card-b);
}
.nav-in { position: relative; display: flex; width: 100%; max-width: 560px; margin: 0 auto; }
.nav button {
  flex: 1; height: 52px; border: 0; background: none; color: var(--tab); cursor: pointer;
  font: 500 12px/1 inherit; font-family: inherit; letter-spacing: 1.2px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
}
.nav button[aria-selected="true"] { color: var(--tab-on); font-weight: 900; }
.ind { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(100% / 6); padding: 0 12px; transition: transform .25s ease; pointer-events: none; }
.ind::after { content: ""; display: block; height: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
.page { display: none; flex-direction: column; gap: 20px; }
.page.on { display: flex; }
.ptitle { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 700; }
.badge { width: 32px; height: 32px; border: 2px solid #888; border-radius: 6px; background: #000; color: #f00; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.card { background: var(--card); border: 1px solid var(--card-b); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ctitle { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--label); }
.ctitle i { width: 4px; height: 16px; border-radius: 2px; background: var(--ac, #888); flex: none; }
.dyn { display: flex; flex-direction: column; gap: 12px; }
.row2 { display: flex; gap: 8px; }
.row2 > .nf { flex: 1; }
.rowc { display: flex; justify-content: center; }
.nf { display: flex; flex-direction: column; align-items: center; }
.nf > label { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; white-space: nowrap; }
.nfrow { display: flex; align-items: center; gap: 2px; }
.nfrow input {
  width: 72px; height: 44px; padding: 0 8px; text-align: center;
  font: 700 20px/1 inherit; font-family: inherit; color: var(--fc, var(--text));
  background: transparent; border: 1.5px solid var(--input-b); border-radius: 10px; outline: none;
}
.nfrow input:focus { border-color: var(--fc, var(--text)); }
.nfrow input.err { border-color: var(--danger); }
.step { width: 32px; height: 44px; border: 0; border-radius: 10px; background: var(--step); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.step:active { opacity: .6; }
.btn { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: 600 15px/1 inherit; font-family: inherit; cursor: pointer; }
.btn:disabled { opacity: .35; cursor: default; }
.btn:not(:disabled):active { background: var(--step); }
.alert { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.alert svg { flex: none; }
.rbox { display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--c) 6%, transparent); border: 1px solid color-mix(in srgb, var(--c) 14%, transparent); }
.rbox .rbl { font-size: 9px; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, transparent); text-align: center; }
.rbox .rbv { font-size: clamp(22px, 7.4vw, 28px); font-weight: 900; letter-spacing: 1px; color: var(--c); white-space: nowrap; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rc { background: var(--tile); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.rl { font-size: 14px; font-weight: 600; letter-spacing: .5px; opacity: .88; }
.rv { display: flex; align-items: center; gap: 4px; font-size: 18px; font-weight: 700; white-space: nowrap; }
.ru { font-size: 12px; font-weight: 400; color: var(--label); margin-left: -1px; }
.rr { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.rrl { font-size: 16px; font-weight: 600; opacity: .88; }
.rrv { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; }
.tiles { display: flex; gap: 12px; }
.tile { flex: 1; background: var(--tile); border-radius: 12px; padding: 8px; text-align: center; }
.tile .t1 { font-size: 9px; color: var(--label); }
.tile .t2 { font-size: 18px; font-weight: 700; color: var(--cellv); }
.tile .t3 { font-size: 9px; font-weight: 700; color: var(--accent); opacity: .85; }
.hint { font-size: 14px; color: var(--label); }
.hint.src { color: var(--label3); }                          /* lignes « Source » */
.hint.ok { color: var(--label2); white-space: pre-line; }   /* lignes « Choix validé » */
.hint.pre { white-space: pre-line; }
.hint.lh { line-height: 20px; }
.hint.sm { font-size: 13px; line-height: 16px; }
</style>

<script>
(function () {
'use strict';

/* ───────────── Stockage local (par appareil) ───────────── */
var KEY = 'ccr1:';
function lsGet(k) { try { return localStorage.getItem(KEY + k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(KEY + k, v); } catch (e) {} }
var NAMES = ['prof','dilO2','dilHe','boO2','boHe','trO2','trHe','swt','decoO2','injO2','injHe','tgO2','tgHe','c1','c2','heli',
             'sProf','sConso','sTpsp','sCs','sTpsr','sVol','sDist','sPb','boPea','boDens','dPpo2','dDens','dPea','decoSrc','swO2','swHe','trSrc','dilSrc','decoSel','boSrc'];
var S = {};
NAMES.forEach(function (n) { S[n] = lsGet(n); });
if (S.boPea === '') S.boPea = '30';     // réglages du bailout proposé (valeurs par défaut)
if (S.boDens === '') S.boDens = '6.3';
if (S.dPpo2 === '') S.dPpo2 = '1';      // réglages du diluant proposé (valeurs par défaut)
if (S.dDens === '') S.dDens = '6.1';
if (S.dPea === '') S.dPea = '30';

//<calc>
/* ───────────── Outils de calcul ───────────── */
function dec(s) {
  if (s == null) return null;
  var t = String(s).replace(',', '.').trim();
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  var n = Number(t);
  return isFinite(n) ? n : null;
}
function f(x, d) { return x.toFixed(d).replace('.', ','); }
function fo(x, d) { return (x == null || isNaN(x)) ? '--' : f(x, d); }
function clampv(x, lo, hi, def) { return x == null ? def : Math.min(Math.max(x, lo), hi); }
function clean(x) { return x % 1 === 0 ? String(Math.trunc(x)) : f(x, 1); }
function nz(x) { return x == null ? 0 : x; }
var RHO = { o2: 1.359, n2: 1.189, he: 0.170 };   // g/L à 15 °C (CE/ISO)
var SETPOINT = 1.3;
var AUTO_MIN_DEPTH = 31.6, BAILOUT_MIN_DEPTH = 37.6;
var HE_DEFAULT_PCT = 98;
var AUTO_MAX_DENS = 6.10;   // densité maxi du diluant proposé (g/L)
/* Contraintes du bailout proposé */
var BO_PPO2_MAX = 1.6, BO_PPO2_MIN = 1.3;   // PPO2 entre 1.3 et 1.6
var BO_N2_MAX_PTS = 4;                      // N2 du BO ≤ N2 du diluant + 4 points
var BO_CDI_PCT_MAX = 10;                    // écart relatif de N2 ≤ 10 %
var BO_CDI_MAX = 0.5;                       // delta PPN2 ≤ 0.5 bar (diluant et boucle)
var BO_PEA_MAX = 34;                        // PEA ≤ 34 m
var BO_DENS_MAX = 6.9;                      // densité ≤ 6.9 g/L

var LIM = {
  ppo2: function (v) { return (v > 1.15 || v < 0.48) ? 'danger' : (v > 1.1 || v < 0.5) ? 'warn' : 'ok'; },
  pea: function (v) { return v > 35 ? 'danger' : v > 31 ? 'warn' : 'ok'; },
  ppo2Bailout: function (v) { return (v > 1.6 || v < 0.48) ? 'danger' : v < 0.5 ? 'warn' : 'ok'; },
  cdiPpn2: function (v) { return v > 0.5 ? 'danger' : 'ok'; },
  cdiPercent: function (v) { return v > 20 ? 'danger' : v > 10 ? 'warn' : 'ok'; },
  densite: function (v) { return v > 6.8 ? 'danger' : v > 6.3 ? 'warn' : 'ok'; }
};
function st(x, fn) { return x == null ? 'ok' : fn(x); }

function build(o2, he, n2, pabs) {
  var ppn2 = n2 * pabs / 100;
  return { o2: o2, he: he, n2: n2, ppo2: o2 * pabs / 100, ppn2: ppn2,
           pea: ((ppn2 / 0.79) - 1) * 10,
           densite: (o2 * RHO.o2 + he * RHO.he + n2 * RHO.n2) / 100 * pabs };
}
function ppn2ForPea(pea) { return 0.79 * (pea / 10 + 1); }       // 30 m -> 3.16 bar
function autoMinDepth(ppo2, pea) { return (ppo2 + ppn2ForPea(pea) - 1) * 10; }
function autoDil(pabs, ppo2, pea, densMax) {
  var o2 = 100 * (ppo2 / pabs), n2 = 100 * (ppn2ForPea(pea) / pabs);
  // N₂ maximal pour ne pas dépasser la densité limite (le N₂ est remplacé par de l'hélium)
  var n2Max = (densMax / pabs * 100 - 100 * RHO.he - o2 * (RHO.o2 - RHO.he)) / (RHO.n2 - RHO.he);
  n2 = Math.min(n2, Math.max(n2Max, 0));
  return build(o2, 100 - o2 - n2, n2, pabs);
}
function mix(o2, he, pabs) {
  if (!(o2 >= 0 && o2 <= 100) || !(he >= 0 && he <= 100) || o2 + he > 100) return null;
  return build(o2, he, 100 - o2 - he, pabs);
}
/* Bailout proposé : le plus de N₂ possible dans les limites, PPO₂ la plus haute possible entre 1.3 et 1.6 */
function bailoutProposed(pabs, ppn2Dil, ppn2Boucle, peaMax, densMax) {
  if (pabs <= 1.0) return null;
  var o2Pref = BO_PPO2_MAX / pabs * 100, o2Min = BO_PPO2_MIN / pabs * 100;
  if (o2Min > 100) return null;
  var n2Cap = 0.79 * (1 + peaMax / 10) / pabs * 100;
  if (ppn2Dil > 0) {
    var n2Dil = ppn2Dil / pabs * 100;
    n2Cap = Math.min(n2Cap, n2Dil + BO_N2_MAX_PTS, n2Dil * (1 + BO_CDI_PCT_MAX / 100), (ppn2Dil + BO_CDI_MAX) / pabs * 100);
    if (ppn2Boucle > 0) n2Cap = Math.min(n2Cap, (ppn2Boucle + BO_CDI_MAX) / pabs * 100);
  } else {
    n2Cap = Math.min(n2Cap, 3.16 / pabs * 100);
  }
  var o2 = Math.min(Math.max(Math.min(o2Pref, 100 - n2Cap), o2Min), 100);
  // densité : si elle dépasse la limite, on remplace du N₂ par de l'hélium (l'O₂ ne bouge pas)
  var n2Dens = (densMax / pabs * 100 - 100 * RHO.he - o2 * (RHO.o2 - RHO.he)) / (RHO.n2 - RHO.he);
  var n2 = Math.max(Math.min(n2Cap, 100 - o2, n2Dens), 0);
  return build(o2, 100 - o2 - n2, n2, pabs);
}
function loopMix(dil, pabs) {
  var o2 = SETPOINT / pabs * 100;
  if (o2 > 100) return null;
  var n2 = dil.n2 > 0 ? (100 - o2) / (1 + dil.he / dil.n2) : 0;
  return build(o2, 100 - o2 - n2, n2, pabs);
}

/* Travel */
/* Travel proposé : règles par zone de profondeur de plongée */
var TR = { aMax: 40, bMax: 75, aO2: 0.32, bO2Min: 50, ppo2Max: 1.6, ppo2Min: 1.4, cdiMax: 0.5, dn2Max: 0.25, depthMax: 45, boSwPpo2: 0.5, n2MaxPts: 0.04 };   // zone 76–120 m : switch le plus haut (PPO₂ BO 0.5), N₂ ≤ BO + 4 points
function proposeTravel(profondeur, o2bopPct, n2bopPct) {
  if (!(profondeur > 0)) return null;
  var o2bop = o2bopPct / 100, n2bop = n2bopPct / 100, hasBo = o2bop > 0;
  var pCap = TR.depthMax / 10 + 1, o2, he, pabs, zone;
  if (profondeur <= TR.aMax) {                    // 1–40 m : NX 32, switch à PPO2 1.6
    o2 = TR.aO2; he = 0; pabs = TR.ppo2Max / o2;
    zone = 'Zone 1–40 m : NX 32 systématique';
  } else if (profondeur <= TR.bMax) {             // 41–75 m : plus petit NX ≥ 50 % dans les limites
    zone = 'Zone 41–75 m : NX ≥ 50 %, PPO₂ 1.4–1.6, CDI ≤ 0.5 bar, écart N₂ ≤ 25 %';
    var found = false;
    for (var pct = TR.bO2Min; pct <= 100 && !found; pct++) {
      var o = pct / 100, n = 1 - o, p = Math.min(TR.ppo2Max / o, pCap);
      if (hasBo) {
        if (n2bop > 0 && n > (1 + TR.dn2Max) * n2bop + 1e-9) continue;
        if (n > n2bop) p = Math.min(p, TR.cdiMax / (n - n2bop));
      }
      if (p >= TR.ppo2Min / o - 1e-9) { o2 = o; he = 0; pabs = p; found = true; }
    }
    if (!found) return null;
  } else {                                        // 76–120 m : le plus de N₂ possible, hélium en complément
    zone = 'Zone 76–120 m : PPO₂ 1.4–1.6, PPO₂ BO ≥ 0.5, N₂ ≤ BO + 4 pts, CDI ≤ 0.5 bar, écart N₂ ≤ 25 %, switch ≤ 45 m';
    if (!hasBo) return null;
    var p2 = Math.min(TR.boSwPpo2 / o2bop, pCap);
    if (p2 <= 1.0) return null;
    var o2Pref = TR.ppo2Max / p2, o2Min = TR.ppo2Min / p2;
    if (o2Min > 1.0) return null;
    var n2Cap = n2bop > 0 ? Math.min((1 + TR.dn2Max) * n2bop, n2bop + TR.n2MaxPts, n2bop + TR.cdiMax / p2) : Math.min(TR.n2MaxPts, TR.cdiMax / p2);
    o2 = Math.min(Math.max(Math.min(o2Pref, 1 - n2Cap), o2Min), 1.0);
    var n2b = Math.max(Math.min(n2Cap, 1 - o2), 0);
    he = 1 - o2 - n2b; pabs = p2;
  }
  var n2 = 1 - o2 - he;
  return { isNx: he < 0.005, o2: o2, he: he, n2: n2, profondeur: (pabs - 1) * 10,
           densite: (o2 * RHO.o2 + he * RHO.he + n2 * RHO.n2) * pabs,
           cdi: hasBo ? (n2 - n2bop) * pabs : null, ppo2Bo: hasBo ? o2bop * pabs : null,
           cdiPercent: n2bopPct > 0 ? ((n2 * 100 / n2bopPct) - 1) * 100 : null, zone: zone };
}
/* Travel proposé pour un switch imposé (mêmes règles que proposeTravel) -> {o2, he} en fractions, ou null */
var SW_DEPTH_MAX = 120;   // Choix SW du Travel : seule limite = celle de l'appli
function proposeTravelAt(profondeur, sw, o2bopPct, n2bopPct) {
  if (!(profondeur > 0) || !(sw > 0) || sw > SW_DEPTH_MAX) return null;
  if (profondeur <= TR.aMax) return { o2: TR.aO2, he: 0 };
  var p = sw / 10 + 1, o2bop = o2bopPct / 100, n2bop = n2bopPct / 100, hasBo = o2bop > 0;
  var o2Max = Math.min(TR.ppo2Max / p, 1), o2Ppo2Min = TR.ppo2Min / p;
  if (profondeur <= TR.bMax) {                    // plus petit NX ≥ 50 % dans les limites
    var low = Math.max(TR.bO2Min / 100, o2Ppo2Min);
    if (hasBo) {
      if (n2bop > 0) low = Math.max(low, 1 - (1 + TR.dn2Max) * n2bop);
      low = Math.max(low, 1 - (n2bop + TR.cdiMax / p));
    }
    var o2 = Math.ceil(low * 100 - 1e-9) / 100;
    return o2 <= o2Max + 1e-9 ? { o2: o2, he: 0 } : null;
  }
  if (!hasBo || o2Ppo2Min > 1) return null;       // 76–120 m : le plus de N₂ possible, hélium en complément
  var n2Cap = n2bop > 0 ? Math.min((1 + TR.dn2Max) * n2bop, n2bop + TR.n2MaxPts, n2bop + TR.cdiMax / p) : Math.min(TR.n2MaxPts, TR.cdiMax / p);
  var o2c = Math.min(Math.max(Math.min(o2Max, 1 - n2Cap), o2Ppo2Min), 1);
  var n2c = Math.max(Math.min(n2Cap, 1 - o2c), 0);
  return { o2: o2c, he: Math.max(1 - o2c - n2c, 0) };
}
function travelAt(pabs, o2, he, o2bopRatio, n2bopRatio) {
  var n2 = 100 - o2 - he, ppn2 = n2 / 100 * pabs, hasBo = o2bopRatio > 0;
  return { depth: (pabs - 1) * 10, ppn2: ppn2, pea: ((ppn2 / 0.79) - 1) * 10,
           ppo2Bo: hasBo ? o2bopRatio * pabs : null, ppo2Travel: o2 / 100 * pabs,
           densite: (o2 * RHO.o2 + he * RHO.he + n2 * RHO.n2) / 100 * pabs,
           cdi: hasBo ? ppn2 - n2bopRatio * pabs : null };
}
function boSwitchStatus(v) { return v < 0.5 ? 'danger' : v > 1.6 ? 'warn' : 'ok'; }
function travelPpo2Status(v) { return v > 1.7 ? 'danger' : v > 1.61 ? 'warn' : 'ok'; }

/* Déco */
/* Déco proposée : PPO2 du travel au changement de 0.5 à 0.8, écart relatif de N2 ≤ 25 % */
var DECO_TRAV_PPO2_MAX = 0.8, DECO_TRAV_PPO2_MIN = 0.5, DECO_DN2_MAX = 0.25;
function decoPctStatus(v) { return v > DECO_DN2_MAX * 100 ? 'danger' : 'ok'; }
function proposeDeco(o2Pct, hePct) {
  if (o2Pct <= 0) return null;
  var o2tr = o2Pct / 100, n2tr = (100 - o2Pct - hePct) / 100;
  if (n2tr < 0) return null;
  var pMax = DECO_TRAV_PPO2_MAX / o2tr, pMin = DECO_TRAV_PPO2_MIN / o2tr;      // switch le plus profond / le plus haut
  var o2Needed = 1 - (1 + DECO_DN2_MAX) * n2tr;                                // O₂ déco ≥ 1 − 1.25·n2tr
  var pCdi = o2Needed > 0 ? 1.6 / o2Needed : Infinity;
  var p = Math.max(Math.min(pMax, pCdi), pMin);   // si 25 % est inatteignable : switch le plus haut (gaz le plus riche)

      (airZone ? hint('Profondeur ≤ 40 m : air, sans calcul') : autoM.n2 < 100 * ppn2ForPea(peaEq) / pabs - 0.05 ? hint('N₂ réduit pour limiter la densité à ' + f(densDil, 2) + ' g/L (PEA inférieure à ' + f(peaEq, 0) + ' m)') : '');
  } else {
    D.dilAuto.innerHTML = mixHead('--', '--', 'var(--label)', 'MÉLANGE PROPOSÉ') +
      (profondeur > 0 ? hint('Diluant auto non applicable pour une profondeur inférieure à ~' + f(autoMinDepth(ppo2Dil, peaEq), 0) + ' m') : '');
  }
  B.dil.disabled = !autoUsable;
  setInfo(D.dilInfo, dil ? '✔Choix validé : diluant ' + (S.dilSrc === 'prop' ? 'proposé:' : 'perso:') + ' \n(' + gasLabel(dil.o2, dil.he) + ')' : '');

  var al = '';
  if (o2V != null && o2V < 5) al += alertB('O₂ inférieur à 5 %');
  if (o2V != null && o2V > 50) al += alertB('O₂ supérieur à 50 %');
  if (o2V != null && heV != null && o2V + heV > 100) al += alertB('O₂ + He dépasse 100 % (' + f(o2V + heV, 2) + ' %)');
  if (dil && dil.ppo2 > 1.0) al += alertB('PPO₂ du diluant élevée', 'warn');
  D.dilChoice.innerHTML = al +
    mixHead(dil ? clean(dil.o2) : '--', dil ? clean(dil.he) : '--', 'var(--result)', 'DILUANT CHOISI') +
    pair('PEA', dil ? f(dil.pea, 2) : '--', ' m', dil ? LIM.pea(dil.pea) : 'ok', 'PPO₂', dil ? f(dil.ppo2, 2) : '--', ' bar', dil ? LIM.ppo2(dil.ppo2) : 'ok') +
    pair('N₂', dil ? f(dil.n2, 1) : '--', ' %', 'ok', 'PPN₂', dil ? f(dil.ppn2, 2) : '--', ' bar', 'ok') +
    rrow('Densité', dil ? f(dil.densite, 2) : '--', ' g/L', dil ? LIM.densite(dil.densite) : 'ok');
  D.dilLoop.innerHTML =
    mixHead(boucle ? f(boucle.o2, 1) : '--', boucle ? f(boucle.he, 1) : '--', 'var(--seafoam)', 'MÉLANGE DANS LA BOUCLE') +
    pair('O₂', boucle ? f(boucle.o2, 2) : '--', ' %', 'ok', 'He', boucle ? f(boucle.he, 2) : '--', ' %', 'ok') +
    pair('N₂', boucle ? f(boucle.n2, 2) : '--', ' %', 'ok', 'PEA', boucle ? f(boucle.pea, 2) : '--', ' m', boucle ? LIM.pea(boucle.pea) : 'ok') +
    rrow('Densité', boucle ? f(boucle.densite, 2) : '--', ' g/L', boucle ? LIM.densite(boucle.densite) : 'ok');

  /* ── Bailout ── */
  var hasDepth = pabs > 1.0;
  var n2DilFraction = pabs > 0 ? ppn2Dil / pabs : 0;
  function cdiPercent(n2) { return n2DilFraction > 0 ? (n2 / (n2DilFraction * 100) - 1) * 100 : null; }
  var peaMax = clampv(dec(S.boPea), 20, BO_PEA_MAX, 30);
  var densMax = clampv(dec(S.boDens), 5, BO_DENS_MAX, 6.3);
  var boNxZone = hasDepth && profondeur <= 40;           // 1–40 m : NX 32, sans calcul
  var proposed = boNxZone ? build(32, 0, 68, pabs) : hasDepth ? bailoutProposed(pabs, ppn2Dil, ppn2Boucle, peaMax, densMax) : null;
  var proposedOk = proposed != null;
  var cdiProposed = proposedOk ? cdiPercent(proposed.n2) : null;
  M.proposed = proposed; M.proposedOk = proposedOk;
  var boO2 = dec(S.boO2), boHe = dec(S.boHe);
  var bo = (hasDepth && boO2 != null && boHe != null) ? mix(boO2, boHe, pabs) : null;
  var cdiDil = (bo && ppn2Dil > 0) ? bo.ppn2 - ppn2Dil : null;
  var cdiBoucle = (bo && ppn2Boucle > 0) ? bo.ppn2 - ppn2Boucle : null;
  var cdiPctBo = bo ? cdiPercent(bo.n2) : null;

  cardBoProp.setTitle('🫧 BO proposé pour ' + f(profondeur, 0) + ' m');
  if (proposedOk) {
    D.boProp.innerHTML = (proposed.he < 0.005 ? resultBox('NX ' + f(proposed.o2, 1), 'var(--accent)', 'BAILOUT PROPOSÉ') : mixHead(f(proposed.o2, 1), f(proposed.he, 1), 'var(--accent)', 'BAILOUT PROPOSÉ')) +
      (boNxZone ? hint('Profondeur ≤ 40 m : NX 32, sans calcul') : '') +
      pair('Densité', f(proposed.densite, 2), ' g/L', LIM.densite(proposed.densite), 'N₂', f(proposed.n2, 1), ' %', 'ok') +
      (cdiProposed != null && cdiProposed > 9 ? rrow('CDI diff % N₂', f(cdiProposed, 2), ' %', LIM.cdiPercent(cdiProposed)) : '') +
      (cdiProposed != null && cdiProposed > 19 ? alertB('Diff % N₂ : choix du diluant à revoir ?', 'warn') : '');
  } else {
    D.boProp.innerHTML = mixHead('--', '--', 'var(--label)', 'BAILOUT PROPOSÉ') +
      hint(!hasDepth ? 'Saisis d\'abord la profondeur dans l\'écran Diluant.'
           : 'BO auto non applicable à cette profondeur');
  }
  B.bo.disabled = !proposedOk;
  setInfo(D.boInfo, bo ? '✔Choix validé : BO ' + (S.boSrc === 'prop' ? 'proposé:' : 'perso:') + ' \n(' + gasLabel(bo.o2, bo.he) + ')' : '');
  setInfo(D.boSrc, (dil && ppn2Dil > 0) ? 'Source Diluant: ' + gasLabel(dil.o2, dil.he) + ' ' : '');

  al = '';
  if (boO2 != null && boO2 < 5) al += alertB('O₂ inférieur à 5 %');
  if (boO2 != null && boO2 > 50) al += alertB('O₂ supérieur à 50 %');
  if (boO2 != null && boHe != null && boO2 + boHe > 100) al += alertB('O₂ + He dépasse 100 % (' + f(boO2 + boHe, 2) + ' %)');
  if (bo) {
    if (bo.ppo2 > 1.6) al += alertB('PPO₂ du bailout supérieure à 1.6');
    var cdiAlert = nz(cdiPctBo) > 19 || nz(cdiDil) > 0.5 || nz(cdiBoucle) > 0.5;
    if (cdiAlert) al += alertB('Alerte contre-diffusion');
    else if (cdiPctBo != null && cdiPctBo >= 14 && cdiPctBo <= 19) al += alertB('Attention : écart de % N₂', 'warn');
    var sd = LIM.densite(bo.densite);
    if (sd === 'danger') al += alertB('Densité supérieure à 6.8 g/L'); else if (sd === 'warn') al += alertB('Densité en zone critique', 'warn');
    var sp = LIM.pea(bo.pea);
    if (sp === 'danger') al += alertB('PEA supérieure à 35 m'); else if (sp === 'warn') al += alertB('PEA en zone critique', 'warn');
  }
  D.boChoice.innerHTML = al +
    mixHead(bo ? clean(bo.o2) : '--', bo ? clean(bo.he) : '--', 'var(--result)', 'BAILOUT CHOISI') +
    pair('PEA', bo ? f(bo.pea, 2) : '--', ' m', bo ? LIM.pea(bo.pea) : 'ok', 'PPO₂', bo ? f(bo.ppo2, 2) : '--', ' bar', bo ? LIM.ppo2Bailout(bo.ppo2) : 'ok') +
    pair('N₂', bo ? f(bo.n2, 1) : '--', ' %', 'ok', 'PPN₂', bo ? f(bo.ppn2, 2) : '--', ' bar', 'ok') +
    pair('CDI diluant', fo(cdiDil, 2), ' bar', st(cdiDil, LIM.cdiPpn2), 'CDI boucle', fo(cdiBoucle, 2), ' bar', st(cdiBoucle, LIM.cdiPpn2)) +
    rrow('CDI diff % N₂', fo(cdiPctBo, 2), ' %', st(cdiPctBo, LIM.cdiPercent)) +
    rrow('Densité', bo ? f(bo.densite, 2) : '--', ' g/L', bo ? LIM.densite(bo.densite) : 'ok');

  /* ── Travel ── */
  var o2bopPct = nz(dec(S.boO2)), n2bopPct = bo ? bo.n2 : 0;
  var o2bopRatio = o2bopPct / 100, n2bopRatio = n2bopPct / 100, hasBo = o2bopRatio > 0;
  var proposal = proposeTravel(profondeur, o2bopPct, n2bopPct);
  M.proposal = proposal;
  var trSrcHint = hasBo ? hintC('src', 'Source BO: ' + gasLabel(o2bopPct, nz(dec(S.boHe))) + ' ') : '';
  cardTrProp.setTitle(proposal ? '🐠 Trav proposé à ' + f(proposal.profondeur, 1) + ' m' : '🐠 Travel proposé');
  if (proposal) {
    var pct = proposal.cdiPercent;
    D.trProp.innerHTML = trSrcHint +
      resultBox(proposal.isNx ? 'NX ' + f(proposal.o2 * 100, 1) : 'TX ' + f(proposal.o2 * 100, 1) + ' / ' + f(proposal.he * 100, 1), 'var(--accent)', 'TRAVEL PROPOSÉ') +
      (pabs > 1 && o2bopRatio * pabs > 1.61 ? alertB('PPO₂ du BO supérieure à 1.61 bar') : '') +
      pair('PPO₂ BO SW', fo(proposal.ppo2Bo, 2), ' bar', st(proposal.ppo2Bo, boSwitchStatus), 'N₂', f(proposal.n2 * 100, 1), ' %', 'ok') +
      pair(proposal.isNx ? 'Δ PPN₂' : 'CDI', fo(proposal.cdi, 2), ' bar', st(proposal.cdi, LIM.cdiPpn2),
           'CDI diff % N₂', fo(pct, 2), ' %', (pct != null && pct > TR.dn2Max * 100) ? 'danger' : 'ok') +
      rrow('Densité', f(proposal.densite, 2), ' g/L', LIM.densite(proposal.densite)) +
      (pct != null && pct > TR.dn2Max * 100 ? alertB('Diff % N₂ : choix du BO à revoir ?', 'warn') : '') +
      hint(proposal.zone);
  } else {
    D.trProp.innerHTML = trSrcHint + resultBox('--', 'var(--label)', 'TRAVEL PROPOSÉ') +
      hint(!(profondeur > 0) ? 'Saisis d\'abord la profondeur dans l\'écran Diluant.' : !hasBo ? 'Choisis d\'abord un bailout dans l\'écran Bailout.' : 'Pas de travel possible dans les limites (CDI 0.5 bar, écart N₂ 25 %).');
  }
  B.tr.disabled = !proposal;

  var o2In = nz(dec(S.trO2)), heIn = nz(dec(S.trHe));
  var valid = o2In > 0 && o2In <= 100 && heIn >= 0 && heIn <= 100 && o2In + heIn <= 100;
  var n2In = 100 - o2In - heIn;
  var cdiPct = (valid && n2bopPct > 0) ? ((n2In / n2bopPct) - 1) * 100 : null;
  var cdiLabel = heIn === 0 ? 'Δ PPN₂' : 'CDI';
  var chosenText = !valid ? '--' : heIn === 0 ? 'NX ' + clean(o2In) : 'TX ' + clean(o2In) + ' / ' + clean(heIn);
  var atSw = valid ? travelAt(1.6 / (o2In / 100), o2In, heIn, o2bopRatio, n2bopRatio) : null;
  var swtIn = dec(S.swt);
  var swGas = swtIn != null ? proposeTravelAt(profondeur, swtIn, o2bopPct, n2bopPct) : null;
  var swO2 = swGas ? swGas.o2 * 100 : 0, swHe = swGas ? swGas.he * 100 : 0, swN2 = 100 - swO2 - swHe;
  var atSwt = swGas ? travelAt(swtIn / 10 + 1, swO2, swHe, o2bopRatio, n2bopRatio) : null;
  var swCdiPct = (atSwt && n2bopPct > 0) ? ((swN2 / n2bopPct) - 1) * 100 : null;
  var swCdiLabel = swHe < 0.5 ? 'Δ PPN₂' : 'CDI';
  var r1 = function (x) { return Math.round(x * 10) / 10; };
  var swText = !swGas ? '--' : swHe < 0.5 ? 'NX ' + clean(r1(swO2)) : 'TX ' + clean(r1(swO2)) + ' / ' + clean(r1(swHe));
  var swMsg = !(profondeur > 0) ? 'Saisis d\'abord la profondeur dans l\'écran Diluant.'
    : (swtIn == null || swtIn <= 0) ? 'Saisis la profondeur du switch.'
    : swtIn > SW_DEPTH_MAX ? ''
    : (profondeur > TR.bMax && !hasBo) ? 'Choisis d\'abord un bailout dans l\'écran Bailout.'
    : 'Pas de travel possible à cette profondeur dans les limites (PPO₂ 1.4–1.6, CDI 0.5 bar, écart N₂ 25 %).';
  M.swGas = swGas; M.swtIn = swtIn;
  M.atSw = atSw;
  B.sw.disabled = !swGas;
  D.trChoice.innerHTML = switchAlerts(S.trO2, o2In, heIn, atSw, cdiPct) +
    resultBox(chosenText, 'var(--result)', 'TRAVEL CHOISI · SWITCH PPO₂ 1.6') +
    switchResults(atSw, n2In, cdiPct, cdiLabel, false);
  var decoSwLabel = dec(S.swHe) > 0 ? 'TX ' + clean(nz(dec(S.swO2))) + ' / ' + clean(nz(dec(S.swHe))) : 'NX ' + clean(nz(dec(S.swO2)));
  D.trSw.innerHTML =
    (swtIn != null && swtIn > SW_DEPTH_MAX ? alertB('Profondeur de switch limitée à ' + SW_DEPTH_MAX + ' m') : '') +
    switchAlerts(swGas ? 'x' : '', swO2, swHe, atSwt, swCdiPct) +
    resultBox(swText, 'var(--seafoam)', (swtIn != null && swtIn > 0 && swtIn <= SW_DEPTH_MAX) ? 'TRAVEL PROPOSÉ · SWITCH À ' + f(swtIn, 0) + ' m' : 'TRAVEL PROPOSÉ') +
    ((!swGas && swMsg) ? hint(swMsg) : '') +
    switchResults(atSwt, swN2, swCdiPct, swCdiLabel, true);
  var trInfoTxt = S.decoSrc !== '' ? '✔Choix validé : Travel du SW à ' + S.decoSrc + ' m: \n(' + decoSwLabel + ')'
    : valid ? (S.trSrc === 'prop' ? '✔Choix validé : Travel proposé: \n(' + chosenText + ')' : '✔Choix validé : Travel Perso: \n(' + chosenText + ')') : '';
  setInfo(D.trInfo, trInfoTxt); setInfo(D.swInfo, trInfoTxt);

  /* ── Déco ── */
  var fromSw = S.decoSrc !== '';       // travel du « Choix SW » si le bouton y a été utilisé, sinon « Choix du Travel »
  var o2trPct = nz(dec(fromSw ? S.swO2 : S.trO2)), hetrPct = nz(dec(fromSw ? S.swHe : S.trHe)), n2trPct = 100 - o2trPct - hetrPct;
  var hasTravel = o2trPct > 0 && n2trPct >= 0;
  var travelTxt = hetrPct === 0 ? 'NX ' + clean(o2trPct) : 'TX ' + clean(o2trPct) + ' / ' + clean(hetrPct);
  var decoTravHint = hasTravel ? hintC('src', 'Source Travel : ' + travelTxt + ' ' + (fromSw ? '(SW à ' + S.decoSrc + ' m)' : '')) : '';
  var dp = proposeDeco(o2trPct, hetrPct);
  M.decoProposal = dp;
  cardDecoProp.setTitle(dp ? '💨 Déco proposé ' + f(dp.profondeur, 0) + ' m' : '💨 Déco proposé');
  if (dp) {
    var dpct = dp.cdiPercent;
    D.decoProp.innerHTML = decoTravHint + resultBox('NX ' + f(dp.o2 * 100, 0), 'var(--accent)', 'DÉCO PROPOSÉE') +
      (dpct != null && dpct > DECO_DN2_MAX * 100 ? alertB('Diff % N₂ critique : vérifiez la cohérence du mélange', 'warn') : '') +
      pair('N₂', f(dp.n2 * 100, 1), ' %', 'ok', 'Δ PPN₂', f(dp.cdi, 2), ' bar', LIM.cdiPpn2(dp.cdi)) +
      pair('PPO₂ Trav au SW', f(dp.ppo2Trav, 2), ' bar', decoTravStatus(dp.ppo2Trav), 'CDI diff % N₂', fo(dpct, 1), ' %', st(dpct, decoPctStatus));
  } else {
    D.decoProp.innerHTML = decoTravHint + resultBox('--', 'var(--label)', 'DÉCO PROPOSÉE') + hint('Configurez un gaz de Travel pour obtenir une suggestion.');
  }
  B.deco.disabled = !dp;
  var dO2 = nz(dec(S.decoO2)), dValid = dO2 > 0 && dO2 <= 100, dN2 = 100 - dO2;
  var pabsSw = dValid ? 1.6 / (dO2 / 100) : 0, profSw = (pabsSw - 1) * 10;
  var ppo2TravSw = (dValid && hasTravel) ? o2trPct / 100 * pabsSw : null;
  var cdiSw = (dValid && hasTravel) ? (dN2 / 100) * pabsSw - (n2trPct / 100) * pabsSw : null;
  var dCdiPct = (dValid && n2trPct > 0) ? (dN2 / n2trPct - 1) * 100 : null;
  D.decoChoice.innerHTML =
    (nz(cdiSw) > 0.5 ? alertB('Attention : Augmentation PPN₂ > 0.5 bar') : '') +
    resultBox(dValid ? 'NX ' + clean(dO2) : '--', 'var(--result)', 'DÉCO CHOISIE') +
    pair('Prof SW', dValid ? f(profSw, 1) : '--', ' m', 'ok', 'N₂', dValid ? f(dN2, 0) : '--', ' %', 'ok') +
    pair('PPO₂ Travel SW', fo(ppo2TravSw, 2), ' bar', st(ppo2TravSw, decoTravStatus), 'Δ PPN₂', fo(cdiSw, 2), ' bar', st(cdiSw, LIM.cdiPpn2)) +
    rrow('CDI diff % N₂', fo(dCdiPct, 1), ' %', st(dCdiPct, decoPctStatus));
  setInfo(D.decoInfo, dValid ? '✔Choix validé : déco ' + (S.decoSel === 'prop' ? 'proposée:' : 'perso:') + ' \n(NX ' + clean(dO2) + ')' : '');

  /* ── Mix Gaz ── */
  var injDefault = S.injO2.trim() === '' && S.injHe.trim() === '';
  var injO2Pct = injDefault ? 0 : nz(dec(S.injO2));
  var injHePct = injDefault ? HE_DEFAULT_PCT : nz(dec(S.injHe));
  var injected = gas(injO2Pct / 100, injHePct / 100);
  D.mgInj.innerHTML = (!gValid(injected) ? alertB('O₂ + He injecté dépasse 100 %') : '') +
    resultBox('NX'.replace('NX', prefix(injHePct)) + ' ' + f(injO2Pct, 2) + ' / ' + f(injHePct, 2), 'var(--violet)',
              injDefault ? 'MÉLANGE INJECTÉ · HÉLIUM ' + HE_DEFAULT_PCT + ' %' : 'MÉLANGE INJECTÉ');

  var o2Target = nz(dec(S.tgO2)), heTarget = nz(dec(S.tgHe));
  var targetGas = gas(o2Target / 100, heTarget / 100);
  var targetReady = o2Target > 0 && gValid(targetGas) && gValid(injected);
  var target = targetReady ? computeTarget(targetGas, AIR, injected) : null;
  D.mgTarget.innerHTML =
    resultBox(prefix(heTarget) + ' ' + f(o2Target, 2) + ' / ' + f(heTarget, 2), 'var(--accent)', 'MÉLANGE VISÉ') +
    (o2Target > 0 && !gValid(targetGas) ? alertB('O₂ + He cible dépasse 100 %') : '') +
    (targetReady && !target ? alertB('Cible inatteignable avec ces gaz d\'aspiration et d\'injection') : '') +
    (target && target.f1 > target.f2 ? alertB('Extraction O₂ nécessaire', 'warn') : '') +
    '<div class="tiles">' + tile('CELL 1', target ? f(target.f1, 2) + '%' : '--', 'Inject He') +
    tile('CELL 2', target ? f(target.f2, 2) + '%' : '--', 'Adjust O2') + '</div>' +
    (target ? rrow('Part gaz injecté', f(target.injShare, 1), ' %', 'ok') : '');

  var cell1 = nz(dec(S.c1)), cell2 = nz(dec(S.c2));
  var actual = (cell1 > 0 && cell2 > 0 && gValid(injected)) ? computeActual(cell1, cell2, AIR, injected) : null;
  D.mgCells.innerHTML =
    (actual && !actual.ok ? alertB('CELL 1 incohérente avec les gaz d\'aspiration et d\'injection') : '') +
    (actual && actual.errCell ? alertB('Cell 1 > cell 2 : extraction O₂ nécessaire') : '') +
    (actual && actual.errN2 ? alertB('N₂ négatif : hors limites', 'warn') : '') +
    (actual && actual.errStick ? alertB('Limité à 40 % au stick') : '') +
    resultBox(actual && actual.ok ? prefix(actual.he) + ' ' + f(actual.o2, 2) + ' / ' + f(actual.he, 2) : '--', 'var(--seafoam)', 'MÉLANGE RÉEL OBTENU');

  var o2H = nz(dec(S.heli)), heH = o2H < 20.95 ? (1 - o2H / 20.95) * 100 : 0;
  D.mgHeli.innerHTML = resultBox(prefix(heH, 0.1) + ' ' + f(o2H, 2) + ' / ' + f(heH, 2), 'var(--violet)');

  /* ── Sout ── */
  var sProf = nz(dec(S.sProf)), sConso = nz(dec(S.sConso)), sTpsp = nz(dec(S.sTpsp)), cs = nz(dec(S.sCs)),
      sTpsr = nz(dec(S.sTpsr)), sVol = nz(dec(S.sVol)), sDist = nz(dec(S.sDist)), sPb = nz(dec(S.sPb));
  var sPabs = sProf / 10 + 1, denom = sPabs * sConso * cs;
  var tpsPlg = (sVol > 0 && denom > 0) ? sVol / denom - sTpsr : null;
  var dist = tpsPlg != null ? sTpsp * tpsPlg : null;
  var tpsPlg2 = (sDist > 0 && sTpsp > 0) ? sDist / sTpsp : null;
  var vol2 = tpsPlg2 != null ? sPabs * (sTpsr + tpsPlg2) * sConso * cs : null;
  var typeBloc = (vol2 != null && sPb > 0) ? vol2 / sPb / 2 : null;
  D.sout1.innerHTML = pair('Tps de Plg', fo(tpsPlg, 2), ' mn', (tpsPlg != null && tpsPlg <= 0) ? 'danger' : 'ok', 'Distance', fo(dist, 2), ' m', 'ok');
  D.sout2.innerHTML = pair('Tps de Plg', fo(tpsPlg2, 2), ' mn', 'ok', 'Vol total blocs', fo(vol2, 0), ' l', 'ok');
  D.sout3.innerHTML = resultBox(typeBloc != null ? f(typeBloc, 2) + ' L' : '--', 'var(--seafoam)', 'TYPE DE BLOC');
}

/* ───────────── Onglets ───────────── */
var TABS = ['Dil', 'BO', 'Trav', 'Déco', 'Mix-G', 'Sout'];
var tabsEl = document.getElementById('tabs'), ind = document.getElementById('ind'), tabBtns = [];
TABS.forEach(function (t, i) {
  var b = h('button'); b.type = 'button'; b.textContent = t; b.setAttribute('role', 'tab');
  b.addEventListener('click', function () { showTab(i); });
  tabsEl.insertBefore(b, ind); tabBtns.push(b);
});
function showTab(i) {
  pageEls.forEach(function (p, k) { p.classList.toggle('on', k === i); });
  tabBtns.forEach(function (b, k) { b.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
  ind.style.transform = 'translateX(' + (i * 100) + '%)';
  lsSet('tab', String(i));
  window.scrollTo(0, 0);
}
var t0 = parseInt(lsGet('tab'), 10);
showTab(isNaN(t0) || t0 < 0 || t0 >= TABS.length ? 0 : t0);
update();

/* ───────────── Service worker (usage hors connexion) ───────────── */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  });
}

})();
